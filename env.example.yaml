# YAML-standardized environment bootstrap (apt + pip)

version: 1

# Grouped example: base / rust / mooncake
groups:
  base:
    apt:
      update: true
      assume_yes: true
      packages:
        - build-essential
        - curl
        - git
        - python3
        - python3-pip
        - libnuma-dev
        - libunwind8
        - libunwind-dev
    pip:
      upgrade: true
      user: false
      # index_url: https://pypi.tuna.tsinghua.edu.cn/simple
      # extra_index_urls:
      #   - https://mirrors.aliyun.com/pypi/simple/
      packages:
        - PyYAML>=6.0
        - requests
        - pytest
        - aiohttp
        - flask
        - minio
        - "etcd3>=0.12.0"
        - tenacity==6.1.0

  rust:
    apt:
      packages:
        - cmake
        - clang
        - libclang-dev
        - llvm-dev
        - pkg-config
    pip:
      packages:
        - setuptools
        - wheel
        - setuptools-rust
        - maturin
    scripts:
      - echo "running rust prepare step..."
      - cmd: ["python3", "unify_kvcache_backend/kvcache_cxx/prepare_build.py"]

  mooncake:
    apt:
      packages:
        - libibverbs-dev
    pip:
      packages:
        - "mooncake-transfer-engine==0.3.4.post2"
